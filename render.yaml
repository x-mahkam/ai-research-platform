services:
  - type: web
    name: ai-research-platform
    runtime: node
    plan: free
    # NODE_ENV=production makes `npm install` omit devDependencies, but the
    # build tools (vite, esbuild, tsx, typescript) live there — force them in.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
