services:
  - type: web
    name: ai-research-platform
    runtime: node
    plan: free
    # NODE_ENV=production makes `npm install` omit devDependencies, but the
    # build tools (vite, esbuild, tsx, typescript) live there — force them in.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # AI providers — set at least one in the dashboard (Environment tab).
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Render's free tier has an ephemeral disk, so a local SQLite file is wiped
      # on every deploy. Set these to a libSQL/Turso database (in the dashboard)
      # for data that survives restarts. Leave unset to use the local file.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
