name: Build Windows package

# Builds a self-contained Windows package (bundled Node + built app + production
# node_modules) and publishes it. Triggers:
#   - push a tag like v0.1.0  -> builds AND attaches the zip to a GitHub Release
#   - manual "Run workflow"   -> builds and uploads the zip as a run artifact
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the Release and upload the asset

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build (client + server bundle)
        run: npm run build

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $pkg = "ai-research-platform"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          # Built app + manifests
          Copy-Item -Recurse dist "$pkg/dist"
          Copy-Item package.json "$pkg/package.json"
          Copy-Item package-lock.json "$pkg/package-lock.json"
          Copy-Item .env.example "$pkg/.env.example"
          Copy-Item packaging/windows/Start-ARP.bat "$pkg/Start-ARP.bat"
          Copy-Item packaging/windows/README-INSTALL.txt "$pkg/README-INSTALL.txt"

          # Production-only dependencies (includes the Windows native @libsql binary)
          npm ci --omit=dev --prefix $pkg

          # Bundle the runner's Node so users need nothing pre-installed.
          New-Item -ItemType Directory -Force -Path "$pkg/node" | Out-Null
          Copy-Item (Get-Command node).Source "$pkg/node/node.exe"

          # Zip it up
          Compress-Archive -Path "$pkg/*" -DestinationPath "ai-research-platform-windows.zip" -Force
          Write-Host "Package contents:"
          Get-ChildItem $pkg | Select-Object Name

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-research-platform-windows
          path: ai-research-platform-windows.zip

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            ai-research-platform-windows.zip `
            --title "AI Research Platform $env:GITHUB_REF_NAME" `
            --notes "Self-contained Windows package. Download the zip, unzip it, and double-click Start-ARP.bat — Node is bundled, nothing to install. See README-INSTALL.txt inside for enabling AI providers and pointing at your COMSOL install."
